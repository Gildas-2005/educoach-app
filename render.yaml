# ============================================================================
# Render Blueprint — Educoach (stack complète : front PWA + API Node + Postgres)
# Une fois ce repo connecté à Render (Dashboard -> New -> Blueprint), Render lit
# ce fichier et provisionne les 3 ressources. Alternative : clé API Render.
#
# Points clés :
#  - JWT_SECRET : généré automatiquement par Render (generateValue), jamais en clair.
#  - DATABASE_URL : injecté depuis la liaison Postgres (interne, non exposé).
#  - Migrations : exécutées par preDeployCommand (processus séparé, idempotent).
#  - API_BASE_URL du front : à renseigner une fois l'URL publique de l'API connue
#    (compile-time dart-define). Vide ici => le front tourne en démo hors-ligne,
#    sans casser le déploiement tant que les stores distants ne sont pas branchés.
# ============================================================================

databases:
  - name: educoach-db
    databaseName: educoach
    plan: free
    ipAllowList: []

services:
  # ---- Front-end PWA (Flutter web servi par nginx) ----
  - type: web
    name: educoach
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    branch: main
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: API_BASE_URL
        sync: false

  # ---- API REST (Node/Express) ----
  - type: web
    name: educoach-api
    runtime: docker
    dockerfilePath: ./server/Dockerfile
    plan: free
    branch: main
    healthCheckPath: /api/health
    autoDeploy: true
    preDeployCommand: npm run migrate
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: educoach-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      # Origine(s) autorisée(s) pour le CORS (le front Render).
      - key: CORS_ORIGINS
        value: https://educoach.onrender.com
